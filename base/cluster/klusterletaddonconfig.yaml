apiVersion: agent.open-cluster-management.io/v1
kind: KlusterletAddonConfig

metadata:
  name: cluster
  namespace: cluster

spec:
  clusterName: cluster

  applicationManager:
    enabled: true

  policyController:
    enabled: true

  searchCollector:
    enabled: true

  certPolicyController:
    enabled: true

  iamPolicyController:
    enabled: true
