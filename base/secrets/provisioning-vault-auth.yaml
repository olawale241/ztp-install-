apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioning-vault
  namespace: cluster
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: provisioning-vault-auth
  namespace: cluster
spec:
  vaultConnectionRef: provisioning-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Patched per cluster, for example ove604a-provisioning.
    role: cluster-provisioning
    serviceAccount: provisioning-vault
    audiences:
      - vault
