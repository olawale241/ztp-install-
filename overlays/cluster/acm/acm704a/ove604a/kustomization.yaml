apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


# ============================================================
# RESOURCES
# ============================================================

resources:
  - ../../../../../base
  - namespace.yaml

  # NMStateConfigs are cluster-specific
  - nmstate/master-0.yaml
  - nmstate/master-1.yaml
  - nmstate/master-2.yaml
  - nmstate/worker-0.yaml
  - nmstate/worker-1.yaml
  - nmstate/worker-2.yaml


# ============================================================
# PATCHES
#
# Normal YAML manifest patches.
# No JSON6902 / op: replace patches.
# ============================================================

patches:

  # ----------------------------------------------------------
  # Cluster resources
  # ----------------------------------------------------------

  - target:
      kind: AgentClusterInstall
      name: cluster
    path: agentclusterinstall-patch.yaml

  - target:
      kind: ClusterDeployment
      name: cluster
    path: clusterdeployment-patch.yaml

  - target:
      kind: InfraEnv
      name: cluster
    path: infraenv-patch.yaml

  - target:
      kind: ManagedCluster
      name: cluster
    path: managedcluster-patch.yaml

  - target:
      kind: KlusterletAddonConfig
      name: cluster
    path: klusterletaddonconfig-patch.yaml


  # ----------------------------------------------------------
  # Hub provisioning Vault resources
  # ----------------------------------------------------------

  - target:
      kind: ServiceAccount
      name: provisioning-vault
    path: provisioning-vault-sa-patch.yaml

  - target:
      kind: VaultConnection
      name: provisioning-vault
    path: provisioning-vault-connection-patch.yaml

  - target:
      kind: VaultAuth
      name: provisioning-vault-auth
    path: provisioning-vault-auth-patch.yaml

  - target:
      kind: VaultStaticSecret
      name: pull-secret
    path: pull-secret-vault-patch.yaml

  - target:
      kind: VaultStaticSecret
      name: bmc-credentials
    path: bmc-vault-patch.yaml

  - target:
      kind: VaultStaticSecret
      name: vault-bootstrap-credentials
    path: vault-bootstrap-secret-patch.yaml


  # ----------------------------------------------------------
  # Day-2 extra manifests
  # ----------------------------------------------------------

  - target:
      kind: ConfigMap
      name: day2-bootstrap
    path: day2-bootstrap-configmap-patch.yaml


  # ----------------------------------------------------------
  # Hub Vault bootstrap
  # ----------------------------------------------------------

  - target:
      kind: ServiceAccount
      name: vault-bootstrap
    path: vault-hub-sa-patch.yaml

  - target:
      kind: Role
      name: vault-bootstrap
    path: vault-hub-role-patch.yaml

  - target:
      kind: RoleBinding
      name: vault-bootstrap
    path: vault-hub-rolebinding-patch.yaml

  - target:
      kind: ConfigMap
      name: vault-bootstrap-script
    path: vault-hub-configmap-patch.yaml

  - target:
      kind: Job
      name: vault-bootstrap
    path: vault-hub-job-patch.yaml


  # ----------------------------------------------------------
  # BareMetalHosts
  # ----------------------------------------------------------

  - target:
      kind: BareMetalHost
      name: master-0
    path: master-0-patch.yaml

  - target:
      kind: BareMetalHost
      name: master-1
    path: master-1-patch.yaml

  - target:
      kind: BareMetalHost
      name: master-2
    path: master-2-patch.yaml

  - target:
      kind: BareMetalHost
      name: worker-0
    path: worker-0-patch.yaml

  - target:
      kind: BareMetalHost
      name: worker-1
    path: worker-1-patch.yaml

  - target:
      kind: BareMetalHost
      name: worker-2
    path: worker-2-patch.yaml


# ============================================================
# REPLACEMENTS
#
# IMPORTANT:
# There must be ONLY ONE replacements: section.
#
# Order:
#   1. cluster namespace -> ove604a
#   2. cluster object names -> ove604a
#   3. BareMetalHost names -> hostnames
# ============================================================

replacements:

  # ==========================================================
  # 1. NAMESPACE
  #
  # Replace the generic base namespace "cluster"
  # with the overlay namespace "ove604a".
  # ==========================================================

  - source:
      kind: Namespace
      name: ove604a
      fieldPath: metadata.name

    targets:

      # ------------------------------------------------------
      # Assisted Installer / Hive
      # ------------------------------------------------------

      - select:
          kind: AgentClusterInstall
          name: cluster
        fieldPaths:
          - metadata.namespace

      - select:
          kind: ClusterDeployment
          name: cluster
        fieldPaths:
          - metadata.namespace

      - select:
          kind: InfraEnv
          name: cluster
        fieldPaths:
          - metadata.namespace

      - select:
          kind: KlusterletAddonConfig
          name: cluster
        fieldPaths:
          - metadata.namespace


      # ------------------------------------------------------
      # Hub provisioning Vault resources
      # ------------------------------------------------------

      - select:
          kind: ServiceAccount
          name: provisioning-vault
        fieldPaths:
          - metadata.namespace

      - select:
          kind: VaultConnection
          name: provisioning-vault
        fieldPaths:
          - metadata.namespace

      - select:
          kind: VaultAuth
          name: provisioning-vault-auth
        fieldPaths:
          - metadata.namespace

      - select:
          kind: VaultStaticSecret
          name: pull-secret
        fieldPaths:
          - metadata.namespace

      - select:
          kind: VaultStaticSecret
          name: bmc-credentials
        fieldPaths:
          - metadata.namespace

      - select:
          kind: VaultStaticSecret
          name: vault-bootstrap-credentials
        fieldPaths:
          - metadata.namespace


      # ------------------------------------------------------
      # Day-2 bootstrap ConfigMap
      # ------------------------------------------------------

      - select:
          kind: ConfigMap
          name: day2-bootstrap
        fieldPaths:
          - metadata.namespace
        options:
          create: true


      # ------------------------------------------------------
      # Hub Vault bootstrap resources
      # ------------------------------------------------------

      - select:
          kind: ServiceAccount
          name: vault-bootstrap
        fieldPaths:
          - metadata.namespace

      - select:
          kind: Role
          name: vault-bootstrap
        fieldPaths:
          - metadata.namespace

      - select:
          kind: RoleBinding
          name: vault-bootstrap
        fieldPaths:
          - metadata.namespace

          # RoleBinding subject must also point to ove604a
          - subjects.0.namespace

      - select:
          kind: ConfigMap
          name: vault-bootstrap-script
        fieldPaths:
          - metadata.namespace

      - select:
          kind: Job
          name: vault-bootstrap
        fieldPaths:
          - metadata.namespace


      # ------------------------------------------------------
      # BareMetalHosts
      # ------------------------------------------------------

      - select:
          kind: BareMetalHost
          name: master-0
        fieldPaths:
          - metadata.namespace

      - select:
          kind: BareMetalHost
          name: master-1
        fieldPaths:
          - metadata.namespace

      - select:
          kind: BareMetalHost
          name: master-2
        fieldPaths:
          - metadata.namespace

      - select:
          kind: BareMetalHost
          name: worker-0
        fieldPaths:
          - metadata.namespace

      - select:
          kind: BareMetalHost
          name: worker-1
        fieldPaths:
          - metadata.namespace

      - select:
          kind: BareMetalHost
          name: worker-2
        fieldPaths:
          - metadata.namespace


  # ==========================================================
  # 2. CLUSTER RESOURCE NAMES
  #
  # Rename generic base resource name "cluster"
  # to the actual cluster name "ove604a".
  #
  # ManagedCluster is cluster-scoped, so only its name changes.
  # ==========================================================

  - source:
      kind: Namespace
      name: ove604a
      fieldPath: metadata.name

    targets:

      - select:
          kind: AgentClusterInstall
          name: cluster
        fieldPaths:
          - metadata.name

      - select:
          kind: ClusterDeployment
          name: cluster
        fieldPaths:
          - metadata.name

      - select:
          kind: InfraEnv
          name: cluster
        fieldPaths:
          - metadata.name

      - select:
          kind: ManagedCluster
          name: cluster
        fieldPaths:
          - metadata.name

      - select:
          kind: KlusterletAddonConfig
          name: cluster
        fieldPaths:
          - metadata.name


  # ==========================================================
  # 3. BAREMETALHOST NAMES
  #
  # Each BareMetalHost patch contains:
  #
  # metadata:
  #   annotations:
  #     bmac.agent-install.openshift.io/hostname: ove604m1
  #
  # Reuse that value as metadata.name.
  # ==========================================================

  - source:
      kind: BareMetalHost
      name: master-0
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: master-0
        fieldPaths:
          - metadata.name


  - source:
      kind: BareMetalHost
      name: master-1
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: master-1
        fieldPaths:
          - metadata.name


  - source:
      kind: BareMetalHost
      name: master-2
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: master-2
        fieldPaths:
          - metadata.name


  - source:
      kind: BareMetalHost
      name: worker-0
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: worker-0
        fieldPaths:
          - metadata.name


  - source:
      kind: BareMetalHost
      name: worker-1
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: worker-1
        fieldPaths:
          - metadata.name


  - source:
      kind: BareMetalHost
      name: worker-2
      fieldPath: metadata.annotations.[bmac.agent-install.openshift.io/hostname]

    targets:
      - select:
          kind: BareMetalHost
          name: worker-2
        fieldPaths:
          - metadata.name
